# Cog config for the siren-song model (HeartMuLa / heartlib fork).
#
# The weights are downloaded at BUILD time, not in setup(). A 3B LM plus the
# codec is far too large to fetch on every cold boot, and a setup() that fails
# to find weights is exactly how you end up with runs that return null.
build:
  gpu: true
  cuda: "12.1"
  python_version: "3.10"
  system_packages:
    - "ffmpeg"          # required to encode mp3/ogg from the native 48kHz wav
    - "git"
  python_requirements: requirements.txt
  # DO NOT pin sdk_version here. It was pinned to "0.18.0" to freeze the runtime,
  # and that is what broke the 2026-08-24 push: Replicate's current loader probes
  # `cog.predictor.BaseRunner` to decide which entry-point interface the class
  # uses, and an SDK that predates BaseRunner has no such attribute, so the probe
  # itself raises before our Predictor is ever reached —
  #
  #     Setup failed: failed to load predictor:
  #     AttributeError: module 'cog.predictor' has no attribute 'BaseRunner'
  #
  # Every slot dies in setup and predictions sit in "starting" indefinitely — the
  # SAME symptom as the old ImportError, from the opposite cause. Leaving this
  # unpinned installs the SDK matching the CLI that builds the image, so loader
  # and SDK always agree.
  run:
    # Checkpoints only. NOTE: `pip install -e .` does NOT belong here — current
    # Cog does not mount your source code into build.run commands, so it fails
    # (or worse, installs nothing). heartlib is installed from git via
    # requirements.txt instead.
    #
    # Shared generation config + tokenizer, then the recommended RL checkpoint
    # and the matching codec release. These MUST land as ./ckpt/HeartMuLa-oss-3B
    # and ./ckpt/HeartCodec-oss — the pipeline resolves those subfolder names.
    - "pip install --no-cache-dir 'huggingface_hub[cli]'"
    - "hf download --local-dir './ckpt' 'HeartMuLa/HeartMuLaGen'"
    - "hf download --local-dir './ckpt/HeartMuLa-oss-3B' 'HeartMuLa/HeartMuLa-RL-oss-3B-20260123'"
    - "hf download --local-dir './ckpt/HeartCodec-oss' 'HeartMuLa/HeartCodec-oss-20260123'"

# Entry point — must match run.py's class + method exactly:
#   "run.py:Runner" → class Runner(BaseRunner) → def run(...)
#
# This is the CURRENT key. Do not go back to `predict: "run.py:Predictor"`: that
# field is a deprecated compatibility shim, and Cog warns about it on every build
# and push. It only works at all while an SDK new enough to contain BaseRunner is
# installed, which is why `sdk_version` above must stay unpinned.
run: "run.py:Runner"