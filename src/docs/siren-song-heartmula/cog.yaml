# Cog config for the siren-song model (HeartMuLa / heartlib fork).
#
# Weights are downloaded at BUILD time, not in setup() — a 3B LM plus codec is
# far too large to fetch on every cold boot, and a setup() that can't find them
# is how runs return null.
build:
  gpu: true
  cuda: "12.1"
  python_version: "3.10"
  system_packages:
    - "ffmpeg"          # encodes mp3/ogg from the native 48kHz wav
    - "git"
  python_requirements: requirements.txt
  # DO NOT pin sdk_version. An older SDK predates BaseRunner, and Cog's loader
  # probes `cog.predictor.BaseRunner` to detect the interface — an SDK without
  # that attribute raises before the Runner is ever reached (the 2026-08-24
  # "starting forever" failure). Unpinned installs the SDK matching the
  # builder's CLI, so loader and SDK always agree.
  run:
    # heartlib is installed from git via requirements.txt (NOT `pip install -e .`
    # here; current Cog does not mount source into build.run commands).
    #
    # Keep these four download lines byte-identical across pushes so the
    # multi-GB HF layers stay cached; only the cheap tail below rebuilds.
    - "pip install --no-cache-dir 'huggingface_hub[cli]'"
    - "hf download --local-dir './ckpt' 'HeartMuLa/HeartMuLaGen'"
    - "hf download --local-dir './ckpt/HeartMuLa-oss-3B' 'HeartMuLa/HeartMuLa-RL-oss-3B-20260123'"
    - "hf download --local-dir './ckpt/HeartCodec-oss' 'HeartMuLa/HeartCodec-oss-20260123'"
    # Guards. On a PLAIN push (no --separate-weights) the first `hf download`
    # (HeartMuLaGen) places tokenizer.json + gen_config.json at ./ckpt root, so
    # they are already where setup() looks — no shadowing mount to beat.
    # (Under --separate-weights the weights image is MOUNTED over ./ckpt at
    # boot and shadows these files; run.py's ./ckptcfg fallback covers that
    # mode. See run.py setup() before reintroducing the flag.)
    # Fail the BUILD, not a billed GPU boot: a layout mistake must surface here
    # where it is free, not in setup() where it bills the full instance-up time.
    - "ls -la ./ckpt && ls -la ./ckpt/HeartMuLa-oss-3B && ls -la ./ckpt/HeartCodec-oss"
    - "test -f ./ckpt/tokenizer.json || (echo 'MISSING ./ckpt/tokenizer.json' && exit 1)"
    - "test -f ./ckpt/gen_config.json || (echo 'MISSING ./ckpt/gen_config.json' && exit 1)"

# Entry point. Current Cog's cog.yaml field is `run:`; the old `predict:` field
# still loads but prints:  ⚠ deprecated field "predict": use "run" instead
# (Historical note: an EARLIER Cog release had no `run:` field at all, and a
# `run:` line there was silently ignored — instant null output. That is why the
# project once documented `predict:` as the only key. Cog renamed the field
# since; the deprecation warning from the current CLI is authoritative.)
# The field points at the entry-point OBJECT; the class it resolves to decides
# which method the loader calls. run.py defines `class Runner(BaseRunner)` with
# `run()`, so `run: "run.py:Runner"` → Runner.run() — current and warning-free.
run: "run.py:Runner"