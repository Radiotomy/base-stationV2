# BASE Mark V2 — Replicate model config
# SilentCipher neural watermark encoder/decoder.
# Hardware: T4 GPU (cost-friendly; cold starts ~2–5 min).
#
# numpy + scipy are DIRECT deps (silentcipher imports them at load time) and
# must stay pinned together in requirements.txt. Letting scipy drift to 1.13+
# reproduces `RuntimeError: Numpy is not available` at `import scipy` time —
# 1.13+ wheels are built against the NumPy 2.x C-API, which is incompatible with
# the 1.x numpy that torch 2.1.0 + numba 0.59.x require. See requirements.txt.

build:
  gpu: true                       # SilentCipher runs on GPU — predicts on Nvidia T4
  python_version: "3.10"
  python_requirements: requirements.txt

# Image runs as the model's default/latest release unless a deployment pins it.
# signature references predict.py:Predictor (the class with the run() method)
run: predict.py:Predictor

image: r8.im/speedwolf2000/base-mark-v2